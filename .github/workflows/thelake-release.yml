name: Build DuckLake extension for thelake

on:
  push:
    branches: [thelake/duckdb-v1.5.6]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      extension_name: ducklake
      duckdb_version: v1.5.6
      ci_tools_version: v1.5-variegata
      exclude_archs: linux_arm64;linux_amd64_musl;linux_arm64_musl;osx_amd64;windows_amd64;windows_arm64;windows_amd64_mingw;wasm_mvp;wasm_eh
      build_duckdb_shell: false
      reduced_ci_mode: disabled

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download platform builds
        uses: actions/download-artifact@v4
        with:
          pattern: ducklake-v1.5.6-extension-*
          path: artifacts
      - name: Package and publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir release
          for platform in linux_amd64 osx_arm64; do
            artifact="artifacts/ducklake-v1.5.6-extension-${platform}/ducklake.duckdb_extension"
            test -s "$artifact"
            mkdir -p "release/${platform}"
            cp "$artifact" "release/${platform}/ducklake.duckdb_extension"
            sha256sum "release/${platform}/ducklake.duckdb_extension" > "release/${platform}/SHA256SUMS"
            cat > "release/${platform}/BUILD.txt" <<EOF_META
          duckdb_version=v1.5.6
          ducklake_source=${GITHUB_SHA}
          platform=${platform}
          artifact=ducklake.duckdb_extension
          EOF_META
            tar -C release -czf "ducklake-v1.5.6-${platform}.tar.gz" "${platform}"
          done
          tag="duckdb-v1.5.6-${GITHUB_SHA:0:12}"
          gh release create "$tag" \
            "ducklake-v1.5.6-linux_amd64.tar.gz" \
            "ducklake-v1.5.6-osx_arm64.tar.gz" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "DuckLake for DuckDB v1.5.6 (${GITHUB_SHA:0:12})" \
            --notes "Built by DuckDB extension-ci-tools from this DuckLake source revision. Each archive includes the extension, SHA-256, and build metadata."
